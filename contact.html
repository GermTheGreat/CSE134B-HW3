    <main>
        <section>
            <h2>Contact Info</h2>
            <p>Email: <strong><a href="mailto:jel139@ucsd.edu">jel139@ucsd.edu</a></strong>.</p>
            <p>Phone: (909) 367-4623</p>
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d429155.64985715755!2d-117.43742247853876!3d32.82463302881226!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80d9530fad921e4b%3A0xd3a21fdfd15df79!2sSan%20Diego%2C%20CA!5e0!3m2!1sen!2sus!4v1792293964443!5m2!1sen!2sus"

                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </section>

        <dialog open>
            <p><strong>Note:</strong> I usually reply within 2 business days.</p>
            <form method="dialog">
                <button type="submit">Close</button>
            </form>
        </dialog>
        <form action="mailto:jel139@ucsd.edu" method="post" enctype="text/plain">
            <fieldset>
                <legend>Send me a message</legend>

                <div>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <button type="submit">Send</button>
            </fieldset>
        </form>
    </main>
